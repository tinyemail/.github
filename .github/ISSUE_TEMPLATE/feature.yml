name: Feature request
description: New capability or change to existing behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem, and who has it?
      placeholder: >-
        Who asked for this (customer, support, you)? What can't they do today?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: What would "done" look like?
      description: How would you tell it's working? Rough is fine — this gets refined at triage.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related conversations — anything else useful.
    validations:
      required: false
