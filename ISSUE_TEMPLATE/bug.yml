name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? Include the exact error message or wrong behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Steps to reproduce / evidence
      description: >-
        Steps, screenshots, log lines, campaign or send IDs — whatever lets someone
        who isn't you see the problem.
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: Affected account
      description: Account UUID (preferred) or customer email, if customer-specific.
      placeholder: e.g. 3f2a9c1e-… or customer@example.com
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Sending is blocked or emails are being lost
        - Degraded — works but wrong/slow/partial
        - Cosmetic or minor
    validations:
      required: true
